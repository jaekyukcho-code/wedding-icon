<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#F8F5F2">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="J♡D Wedding"
  >

  <title>J♡D Wedding</title>

  <!-- iPhone 홈화면 아이콘 -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./apple-touch-icon-v2.png"
  >

  <link
    rel="apple-touch-icon-precomposed"
    sizes="180x180"
    href="./apple-touch-icon-v2.png"
  >

  <!-- 일반 브라우저 아이콘 -->
  <link
    rel="icon"
    type="image/png"
    href="./apple-touch-icon-v2.png"
  >

  <style>
    :root{
      --bg:#F8F5F2;
      --text:#302B2C;
      --muted:#8D8382;
      --rose:#C77B82;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      min-height:100%;

      background:var(--bg);
      color:var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    body{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:
        max(24px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
    }

    .wrap{
      width:100%;
      max-width:420px;
      text-align:center;
    }

    .logo{
      width:112px;
      height:112px;

      margin:0 auto 22px;

      border-radius:25px;

      box-shadow:
        0 10px 30px
        rgba(80,60,60,.10);

      overflow:hidden;
    }

    .logo img{
      display:block;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .eyebrow{
      color:var(--rose);

      font-size:11px;
      font-weight:800;

      letter-spacing:.18em;
    }

    h1{
      margin:10px 0 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:30px;
      font-weight:600;
    }

    .sub{
      margin-top:10px;

      color:var(--muted);

      font-size:13px;
      line-height:1.6;
    }

    .loading{
      margin-top:28px;

      color:var(--muted);

      font-size:11px;
    }

    .dot{
      display:inline-block;

      width:6px;
      height:6px;

      margin:0 2px;

      border-radius:50%;

      background:var(--rose);

      animation:blink 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2){
      animation-delay:.15s;
    }

    .dot:nth-child(3){
      animation-delay:.30s;
    }

    @keyframes blink{
      0%,80%,100%{
        opacity:.25;
        transform:scale(.8);
      }

      40%{
        opacity:1;
        transform:scale(1);
      }
    }

    .openButton{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      width:100%;

      margin-top:24px;
      padding:14px 18px;

      border:0;
      border-radius:16px;

      background:var(--rose);

      color:#fff;

      font-size:14px;
      font-weight:800;

      text-decoration:none;
    }

    .note{
      margin-top:12px;

      color:#A39A98;

      font-size:10px;
      line-height:1.5;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="logo">
      <img
        src="./apple-touch-icon-v2.png"
        alt="J♡D Wedding"
      >
    </div>

    <div class="eyebrow">
      OUR WEDDING
    </div>

    <h1>
      J♡D Wedding
    </h1>

    <div class="sub">
      조재혁 ♥ 백다혜<br>
      Wedding Dashboard
    </div>

    <div class="loading">
      대시보드로 이동 중
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <a
      class="openButton"
      id="openDashboard"
      href="https://script.google.com/macros/s/AKfycbyMeoQwIOuLQWh7ZvlSYjjHDazf-FsLv_BgMLgKcreitgwYeQricUesIpAAy7J1ezm5/exec"
    >
      웨딩 대시보드 열기
    </a>

    <div class="note">
      자동 이동되지 않으면 위 버튼을 눌러주세요.
    </div>

  </main>


  <script>
    const DASHBOARD_URL =
      'https://script.google.com/macros/s/AKfycbyMeoQwIOuLQWh7ZvlSYjjHDazf-FsLv_BgMLgKcreitgwYeQricUesIpAAy7J1ezm5/exec';

    setTimeout(() => {
      window.location.replace(DASHBOARD_URL);
    }, 900);
  </script>

</body>
</html>
